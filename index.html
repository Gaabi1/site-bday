<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Uma surpresa para você 💕</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,500&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="locked">

  <!-- Camadas de efeito -->
  <div id="bg-decor" aria-hidden="true"></div>
  <canvas id="fx" aria-hidden="true"></canvas>
  <div id="dim"></div>

  <!-- Botão de música (fica visível o tempo todo) -->
  <button id="music-btn" type="button" aria-label="Tocar ou pausar música">
    <span class="eq"><i></i><i></i><i></i></span> 🎵 Música
  </button>
  <audio id="audio" src="audio/audio.mp3.mpeg" loop preload="none"></audio>

  <!-- 1. TELA INICIAL -->
  <section id="intro">
    <div class="glass intro-box">
      <p class="intro-emoji">🎀</p>
      <h1>Tenho uma surpresa para você...</h1>
      <button id="open-btn" class="btn" type="button">✨ Abrir surpresa</button>
    </div>
  </section>

  <main id="main" class="hidden">

    <!-- 2. HERO -->
    <section id="hero" class="sec">
      <h2 class="hero-title">Feliz Aniversário,<br><span data-name></span>!</h2>
      <p class="lead" id="hero-sub"></p>
      <p class="scroll-hint">role para descobrir ↓</p>
    </section>

    <!-- 3. IDADE -->
    <section id="age" class="sec reveal">
      <p class="lead">Hoje você completa</p>
      <div class="age-num" id="age-num">0</div>
      <p class="lead">anos! 🎂</p>
    </section>

    <!-- 4. CARTA -->
    <section id="letter" class="sec reveal">
      <h2>Uma cartinha pra você</h2>
      <div class="envelope" id="envelope">
        <div class="env-back"><div class="flap"></div><span class="seal">💗</span></div>
        <div class="paper"><p id="letter-text"></p></div>
      </div>
      <button id="letter-btn" class="btn" type="button">💌 Abrir carta</button>
    </section>

    <!-- 5. GALERIA -->
    <section id="gallery" class="sec reveal">
      <h2>Alguns momentos nossos 💕</h2>
      <div class="grid" id="photo-grid"></div>
    </section>

    <!-- 6. VOCÊ É ESPECIAL PORQUE... -->
    <section id="special" class="sec reveal">
      <h2>Você é especial porque...</h2>
      <div class="cards" id="cards"></div>
    </section>

    <!-- 7. JOGO -->
    <section id="game" class="sec reveal">
      <h2>Vamos descobrir uma coisa...</h2>
      <div class="glass game-out" id="game-out" aria-live="polite">?</div>
      <button id="game-btn" class="btn" type="button">Clique aqui</button>
    </section>

    <!-- 8. BOTÃO ESPECIAL -->
    <section id="more" class="sec reveal">
      <h2>Tenho mais uma coisa para te dizer...</h2>
      <button id="more-btn" class="btn big" type="button">💗 Clique aqui</button>
    </section>

    <!-- 9. FINAL -->
    <section id="end" class="sec reveal">
      <h2 class="hero-title">Feliz aniversário,<br><span data-name></span>!</h2>
      <p class="lead" id="end-text"></p>
    </section>
  </main>

  <!-- Mensagem grande (botão especial) -->
  <div id="big-msg" class="glass">
    <p id="big-text"></p>
    <p id="big-extra"></p>
    <button id="big-close" class="btn" type="button">Continuar 💕</button>
  </div>

  <!-- Modal de fotos -->
  <div id="modal" aria-hidden="true">
    <figure class="modal-box">
      <button id="modal-close" type="button" aria-label="Fechar">✕</button>
      <div id="modal-media"></div>
      <figcaption id="modal-cap"></figcaption>
    </figure>
  </div>

  <script src="script.js"></script>
</body>
</html>
